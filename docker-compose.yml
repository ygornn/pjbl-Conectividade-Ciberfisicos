
services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartrooms-broker
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./broker/passwordfile:/mosquitto/config/passwordfile
      - mqtt_data:/mosquitto/data
    networks:
      - smartrooms-net

  sensors:
    build: ./sensors
    container_name: smartrooms-sensors
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    depends_on:
      - mosquitto
    restart: unless-stopped
    networks:
      - smartrooms-net

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: smartrooms-server
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      PYTHONUNBUFFERED: 1
    ports:
      - "8001:8000"
    volumes:
      - smartspace_data:/data
    depends_on:
      - mosquitto
    restart: unless-stopped
    networks:
      - smartrooms-net

networks:
  smartrooms-net:
    driver: bridge

volumes:
  mqtt_data:
  smartspace_data:
